name: Deploy to Tomcat

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github

      - name: Build and test
        run: mvn clean verify

      - name: SonarQube Cloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=VaishnaviAgarwal-29_build-demo
          -Dsonar.organization=vaishnaviagarwal-29
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests -Djacoco.skip=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-war
          path: target/*.war

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: app-war

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

  
      - name: Deploy to WebLogic
        env:
          WLS_USER: ${{ secrets.WLS_USER }}
          WLS_PASSWORD: ${{ secrets.WLS_PASSWORD }}
        run: |
          WAR_FILE=$(ls target/*.war | head -n 1)
          curl -v -u "$WLS_USER:$WLS_PASSWORD" \
            -H "X-Requested-By: MyClient" \
            -H "Accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -F "model={ name: 'hello', targets: [ 'AdminServer' ] }" \
            -F "deployment=@${WAR_FILE}" \
            "http://localhost:7001/management/weblogic/latest/edit/appDeployments"ame: Deploy to WebLogic
       
      - name: Health check
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/hello/)
            echo "Attempt $i: HTTP status $code"
            if [ "$code" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Pipeline Status Email
        uses: dawidd6/action-send-mail@v3 # NOSONAR
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ needs.deploy.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}: Pipeline for ${{ github.repository }}"
          body: |
            Hi,

            Your Java CI/CD pipeline run has completed.

            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Build Status: ${{ needs.build.result }}
            - Deploy & Health Check Status: ${{ needs.deploy.result }}

            View full logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: vaishnavia473@gmail.com
          from: GitHub Actions <no-reply@github.com>
