name: Deploy to Tomcat

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github

      - name: Build and test
        run: mvn clean verify

      - name: SonarQube Cloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=VaishnaviAgarwal-29_build-demo
          -Dsonar.organization=vaishnaviagarwal-29
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

      - name: Publish to GitHub Packages
        run: mvn deploy -DskipTests -Djacoco.skip=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-war
          path: target/*.war

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: app-war

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Deploy to WebLogic
        env:
         WLS_USER: ${{ secrets.WLS_USER }}
         WLS_PASSWORD: ${{ secrets.WLS_PASSWORD }}
         WLS_URL: ${{ secrets.WEBLOGIC_SERVER_URL }}

        run: |
         WAR_FILE=$(find . -name "*.war" | head -n 1)
         echo "Found WAR file: $WAR_FILE"
         if [ -z "$WAR_FILE" ]; then
           echo "Error: No WAR file found!"
         exit 1
         fi
         FILENAME=$(basename "$WAR_FILE")
         
         curl -v -u "$WLS_USER:$WLS_PASSWORD" \
          -H "X-Requested-By: MyClient" \
          -H "Accept: application/json" \
          -H "Content-Type: multipart/form-data" \
          -F 'model={ "name": "hello", "targets": [ "AdminServer" ] }' \
          -F "deployment=@./$FILENAME" \
          "$WLS_URL/management/weblogic/latest/edit/appDeployments"
      
      - name: Health check
        env:
          WLS_URL: ${{ secrets.WEBLOGIC_SERVER_URL }}
    
        run: |
          for i in $(seq 1 12); do
            if curl -f -s -o /dev/null "$WLS_URL/hello"; then
            echo "Attempt $i: HTTP status $code"
            if [ "$code" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for application to respond... ($i/12)"
            sleep 5
          done
          echo "Health check failed"
          exit 1

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Pipeline Status Email
        uses: dawidd6/action-send-mail@v3 # NOSONAR
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ needs.deploy.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}: Pipeline for ${{ github.repository }}"
          body: |
            Hi,

            Your Java CI/CD pipeline run has completed.

            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Build Status: ${{ needs.build.result }}
            - Deploy & Health Check Status: ${{ needs.deploy.result }}

            View full logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: vaishnavia473@gmail.com
          from: GitHub Actions <no-reply@github.com>
